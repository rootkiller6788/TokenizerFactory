[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenizerfactory"
version = "0.1.0"
description = "TokenizerFactory — 同一语料上训练 / 比较 BPE、WordPiece、Unigram，输出对比矩阵与 Pareto 前沿"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# 核心链路零第三方依赖：落地约束「4060 8G 单机可跑」
#
# 这一条在本项目里是有代价的：三个分词算法都是从零手写的。
# 手写不是为了炫技，而是因为**本项目要研究的是「同一语料下哪种分词策略更合适」**，
# 而黑盒 tokenizer 只能给结论、给不出「为什么」—— 比如 Unigram 的剪枝为什么让它
# 在中文字符上比 BPE 更省 token，只有看到 EM 与剪枝过程才说得清。
# 生产环境当然该用 HuggingFace tokenizers（快得多），因此留了 hf extra。
dependencies = []

[project.optional-dependencies]
# 可选扩展：接 HuggingFace 的 tokenizers 做「手写实现 vs 工业实现」的一致性对照
hf = ["tokenizers>=0.15"]
dev = ["pytest>=7.4"]

[project.scripts]
tokenizerfactory = "tokenizerfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
